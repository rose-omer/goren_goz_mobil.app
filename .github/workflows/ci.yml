name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Bağımlılıklar
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (model gerektirmeyen)
        run: pytest -m "not requires_model"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Debug APK (modeller yerine boş yer tutucu)
        run: flutter build apk --debug

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goren-goz-backend backend

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 5 MB üstü dosya yok
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +5M -print)
          if [ -n "$big" ]; then
            echo "5 MB üstü dosya repoya girmez (modeller HF Hub'da):"
            echo "$big"
            exit 1
          fi
