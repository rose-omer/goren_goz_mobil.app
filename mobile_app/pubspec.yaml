name: goren_goz_mobil
description: Görme engelliler için sesli engel uyarısı ve Türkçe soru-cevap.
publish_to: none
version: 2.0.0+2

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  camera: ^0.12.2
  dio: ^5.9.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  vibration: ^3.2.1
  audioplayers: ^6.5.0
  wakelock_plus: ^1.3.0
  image: ^4.5.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
